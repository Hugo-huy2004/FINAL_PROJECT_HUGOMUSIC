name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: CI only checks out code and runs tests.
permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/server/package-lock.json
            apps/edge/package-lock.json

      # The root installs the workspaces (web, mobile, packages/*); server and edge deploy on their own,
      # so they keep their own lockfiles — exactly what Render and Cloudflare install.
      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix apps/server
          npm ci --prefix apps/edge

      - name: Run Test Suite across All Workspaces
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key-very-long-32chars
          MONGO_URI: mongodb://127.0.0.1:27017/hugo_music_ci
          REDIS_URL: redis://127.0.0.1:6379
        run: npm test

      - name: Verify Web Build (Expo Web Bundle)
        run: npm run build:web
